<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账本与设置 · 网页资产计</title>
  <link rel="stylesheet" href="../shop/shop.css" />
  <link rel="stylesheet" href="options.css" />
<link rel="stylesheet" href="../shared/shell.css"></head>
<body>
  <div class="layout">
    <aside class="sidebar"><a class="brand" href="../popup/index.html"><span class="brand-icon">▤</span><span>网页资产计<small>你的浏览，正在积累。</small></span></a><div class="nav-label">资产实验室</div><a class="nav" href="../overview/index.html">◉ &nbsp; 资产汇总</a><a class="nav" href="../shop/index.html">◈ &nbsp; 增长商店</a><a class="nav" href="../estate/index.html">⌂ &nbsp; 我的地产</a><a class="nav" href="../company/index.html">▥ &nbsp; 我的公司</a><a class="nav" href="../collection/index.html">▧ &nbsp; 收藏品</a><a class="nav" href="../exchange/index.html">⇄ &nbsp; 资产置换</a><a class="nav" href="../investments/index.html">▧ &nbsp; 项目投资</a><a class="nav" href="../achievements/index.html">✧ &nbsp; 成就</a><a class="nav active" href="../options/index.html" aria-current="page">⚙ &nbsp; 账本与设置</a><a class="nav" href="../weekly/index.html">◇ &nbsp; 每周探索任务</a><div class="sidebar-bottom"><span class="live-dot"></span> 所有积累，只在本机<br><small>这里的金额均为虚拟资产。</small></div></aside>
  <main>

    <section class="hero">
      <div><h1>账本与设置</h1></div>
      <div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit second"></div><span class="spark">▤</span><span class="art-label">EVERY VISIT COUNTS</span></div>
    </section>
    <dl class="stats ledger-stats" aria-label="当前账本摘要">
      <div class="wallet"><dt>今日入账</dt><dd id="sToday">¥0.00</dd></div>
      <div><dt>累计收益</dt><dd id="sTotal">¥0.00</dd></div>
      <div><dt>今日有效浏览</dt><dd id="sVisits">0</dd></div>
      <div><dt>累计有效浏览</dt><dd id="sTotalVisits">0</dd></div>
    </dl>
    <div class="settings-grid">

    <section class="card">
      <div class="card-head">
        <h2>计数策略</h2>
      </div>
      <label class="toggle">
        <input type="checkbox" id="countSpa" />
        <span>
          <strong>计入 SPA / History 路由</strong>
          <em>切换页面路径时单独结算。</em>
        </span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="showFormula" checked />
        <span>
          <strong>显示公式拆解</strong>
          <em>显示最近一笔收益明细。</em>
        </span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="autoSettleRecoveries" />
        <span>
          <strong>自动补结算</strong>
          <em>自动结算异常关闭留下的记录。</em>
        </span>
      </label>
      <p class="hint" id="settingsHint" role="status"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>近 7 日</h2>

      </div>
      <div class="week-board" id="weekBoard"></div>
    </section>

    <section class="card wide" id="formulaCard">
      <div class="card-head">
        <h2>收益拆解</h2>

      </div>
      <div id="formulaPanel" class="formula-empty">暂无入账记录。结算一笔后这里会显示明细。</div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>账本操作</h2>
        <p>重置只影响本地数据，无法撤销。</p>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="resetToday">重置今日</button>
        <button type="button" class="btn danger" id="resetAll">重置全部数据</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>数据备份</h2></div>
      <div class="actions">
        <button type="button" class="btn" id="exportData">导出备份</button>
        <button type="button" class="btn" id="importData">导入备份</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden aria-label="选择账本备份">
      </div>
      <p class="hint" id="backupHint" role="status"></p>
    </section>
    </div>

  </main>
  </div>
  <script type="module" src="options.js"></script>
<script type="module" src="../shared/shell.js"></script></body>
</html>
